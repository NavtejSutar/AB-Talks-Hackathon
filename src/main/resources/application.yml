spring:
  application:
    name: wren-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:wrendb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

wren:
  llm:
    priority: ${LLM_PROVIDER_PRIORITY:gemini,groq,openrouter,cerebras}
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    gemini-rpm: ${GEMINI_REQUESTS_PER_MINUTE:5}
    groq-key: ${GROQ_API_KEY:}
    openrouter-key: ${OPENROUTER_API_KEY:}
    cerebras-key: ${CEREBRAS_API_KEY:}
  discovery:
    github-token: ${GITHUB_TOKEN:}
    nvd-key: ${NVD_API_KEY:}
  security:
    debug-token: ${DEBUG_TOKEN:dev-secret-token}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    # Cron: every 4 hours at minute 0. Set to a fast schedule (*/1 * * * * ?) for local testing.
    cron: ${SCHEDULER_CRON:0 0 */4 * * *}
